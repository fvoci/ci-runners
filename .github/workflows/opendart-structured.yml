name: opendart-structured

# OpenDART 정형 API·XBRL 매트릭스 수집. 계획은 opendart-structured/<이름> 브랜치의
# opendart-structured/structured-plan.json이다. 조각마다 러너 하나가 비공개 이미지(수집기)로 받아
# 원본과 조각 manifest를 R2에 올린다. 코드는 이 저장소에 없고 이미지로만 받는다.
# 공개 로그에는 개수만 남긴다: 수집기 출력은 허용한 키(개수·상태)만 통과시키고 나머지 줄은 생략한다.
on:
  push:
    branches: ['opendart-structured/*']

permissions:
  contents: read
  packages: read

concurrency:
  group: opendart-structured-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # 비공개 저장소의 이미지 빌드 워크플로가 게시한 digest로 고정한다(첫 게시 뒤 채운다)
  IMAGE: ghcr.io/fvoci/opendart-collector@sha256:IMAGE_DIGEST
  PLAN: opendart-structured/structured-plan.json

jobs:
  shards:
    name: Read plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: opendart-structured
      - id: plan
        run: |
          python3 -c "import json,os; d=json.load(open(os.environ['PLAN'])); print('shards=' + json.dumps([x['shard'] for x in d['shards']]))" >> "$GITHUB_OUTPUT"

  fetch:
    name: Shard ${{ matrix.shard }}
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: opendart-structured
      - name: Pull collector image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull -q "$IMAGE" >/dev/null
          docker logout ghcr.io
          mkdir -p work
          # 출력 거르개: JSON 줄은 허용한 키만, 예외는 클래스 이름만, 그 밖의 줄은 개수만 남긴다
          cat > "$RUNNER_TEMP/filter.py" <<'EOF'
          import json, re, sys
          KEEP = {'plan', 'shard', 'slot', 'queued', 'done', 'counts', 'stopped', 'left', 'skipped', 'prior',
                  'requests', 'rows', 'list_rows', 'xbrl_rows', 'xbrl_counts', 'uploaded'}
          hidden = 0
          for line in sys.stdin:
              try:
                  doc = json.loads(line)
              except ValueError:
                  doc = None
              if isinstance(doc, dict):
                  print(json.dumps({k: v for k, v in doc.items() if k in KEEP}, ensure_ascii=False), flush=True)
                  continue
              m = re.match(r'^([A-Za-z_][\w.]*(?:Error|Exception|Exit|Interrupt|Collection))\b', line)
              if m:
                  print(f'::error::{m.group(1)}', flush=True)
              else:
                  hidden += 1
          if hidden:
              print(f'({hidden} lines of other output hidden)', flush=True)
          EOF
          # 수집기 실행: 작업 폴더 work/를 /work로, 계획을 /plan.json으로. 환경변수는 이름만 넘긴다(값은 명령줄에 없다)
          cat > "$RUNNER_TEMP/collector" <<'EOF'
          #!/bin/bash
          set -o pipefail
          docker run --rm --init --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/work:/work" -v "$GITHUB_WORKSPACE/$PLAN:/plan.json:ro" \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e OPENDART_BUDGET -e OPENDART_BUDGET_SOURCE -e OPENDART_D1_DATABASE \
            -e CLOUDFLARE_ACCOUNT_ID -e CLOUDFLARE_D1_TOKEN \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_ENDPOINT_URL -e R2_BUCKET \
            -e OPENDART_API_KEY_2 -e OPENDART_API_KEY_3 -e OPENDART_API_KEY_4 -e OPENDART_API_KEY_5 -e OPENDART_API_KEY_6 \
            "$@" 2>&1 | python3 -u "$RUNNER_TEMP/filter.py"
          EOF
          chmod +x "$RUNNER_TEMP/collector"
      - name: Fetch this shard into an empty store
        id: worker
        env:
          OPENDART_BUDGET: d1  # 키 사용량을 D1에서 예약·정산
          OPENDART_BUDGET_SOURCE: ci
          OPENDART_D1_DATABASE: ${{ vars.OPENDART_D1_DATABASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENDART_API_KEY_2: ${{ secrets.OPENDART_API_KEY_2 }}
          OPENDART_API_KEY_3: ${{ secrets.OPENDART_API_KEY_3 }}
          OPENDART_API_KEY_4: ${{ secrets.OPENDART_API_KEY_4 }}
          OPENDART_API_KEY_5: ${{ secrets.OPENDART_API_KEY_5 }}
          OPENDART_API_KEY_6: ${{ secrets.OPENDART_API_KEY_6 }}
        run: |
          "$RUNNER_TEMP/collector" --name opendart-worker "$IMAGE" opendart.structured_ci --data-dir data/api \
            worker --plan /plan.json --shard ${{ matrix.shard }} --max-seconds 9900 --bucket "$R2_BUCKET"
      # 사용량은 원본 업로드와 따로, 그 전에 올린다(실패해도 키 사용량이 남게).
      # 취소·시간 초과 때 docker run 클라이언트만 죽고 컨테이너가 남을 수 있어 먼저 멈추고 잠금을 확인한다
      - name: Upload key usage of this attempt
        if: always() && hashFiles('work/data/api/inventory.sqlite3') != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          docker stop -t 120 opendart-worker >/dev/null 2>&1 || true
          for _ in $(seq 1 90); do flock -n work/data/api/.collector.lock true && break; sleep 2; done
          flock -n work/data/api/.collector.lock true || { echo "::error::collector lock still held after 180s"; exit 1; }
          "$RUNNER_TEMP/collector" "$IMAGE" opendart.structured_ci --data-dir data/api \
            publish --plan /plan.json --part usage --shard ${{ matrix.shard }} --bucket "$R2_BUCKET"
      # 행과 complete.json은 worker가 성공(시간 제한으로 멈춘 것 포함)했을 때만 올린다
      - name: Export, upload originals and shard manifests to R2
        if: always() && steps.worker.outcome == 'success' && hashFiles('work/data/api/inventory.sqlite3') != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          flock -n work/data/api/.collector.lock true || { echo "::error::collector lock held"; exit 1; }
          "$RUNNER_TEMP/collector" "$IMAGE" opendart.structured --data-dir data/api export
          "$RUNNER_TEMP/collector" "$IMAGE" opendart.structured --data-dir data/api push --bucket "$R2_BUCKET"
          "$RUNNER_TEMP/collector" "$IMAGE" opendart.structured_ci --data-dir data/api \
            publish --plan /plan.json --part rows --shard ${{ matrix.shard }} --bucket "$R2_BUCKET"
